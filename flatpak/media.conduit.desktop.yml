app-id: media.conduit.desktop
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: conduit

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download

modules:
  - name: conduit
    buildsystem: simple
    build-commands:
      - cp -a appdir /app/conduit
      - install -Dm755 conduit.sh /app/bin/conduit
      - install -Dm644 media.conduit.desktop /app/share/applications/media.conduit.desktop
      - install -Dm644 media.conduit.desktop.metainfo.xml /app/share/metainfo/media.conduit.desktop.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/media.conduit.desktop.png
    sources:
      - type: dir
        path: appdir
        dest: appdir
      - type: file
        path: conduit.sh
      - type: file
        path: media.conduit.desktop
      - type: file
        path: media.conduit.desktop.metainfo.xml
      - type: file
        path: ../apps/desktop/src-tauri/icons/icon.png
        dest-filename: icon.png
