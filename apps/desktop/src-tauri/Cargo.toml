[package]
name = "conduit-desktop"
version = "0.1.0"
description = "Conduit desktop media client"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "conduit_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
