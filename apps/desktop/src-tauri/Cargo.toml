[package]
name = "conduit-desktop"
version = "0.1.0"
description = "Conduit desktop media client"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "conduit_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
thiserror = "2"
libmpv2 = "4"
libmpv2-sys = "4"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSOpenGL",
  "NSOpenGLView",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSValue"] }

[dev-dependencies]
tempfile = "3"
