[package]
name = "conduit-electron-native"
version = "0.1.0"
description = "Conduit Electron native libmpv bridge"
edition = "2021"
license = "MIT"

[dependencies]
libc = "0.2"
libmpv2 = "4"
libmpv2-sys = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2", features = ["xlib"] }

[build-dependencies]
pkg-config = "0.3"
