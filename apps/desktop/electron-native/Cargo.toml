[package]
name = "conduit-electron-native"
version = "0.1.0"
description = "Conduit Electron native libmpv bridge"
edition = "2021"
license = "MIT"

[features]
linux-helper = []

[[bin]]
name = "conduit-electron-native"
path = "src/linux.rs"
required-features = ["linux-helper"]

[lib]
crate-type = ["cdylib"]
path = "src/main.rs"

[dependencies]
libc = "0.2"
libmpv2 = { version = "7", features = ["render"] }
libmpv2-sys = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2", features = ["xlib"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSResponder",
  "NSScreen",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
  "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes", "CFDate"] }
objc2-core-graphics = { version = "0.3", features = ["CGColorSpace"] }
objc2-core-video = { version = "0.3", features = ["CVBase"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSValue"] }
objc2-open-gl = "0.3"
objc2-quartz-core = { version = "0.3", features = [
  "CALayer",
  "CAOpenGLLayer",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-core-video",
  "objc2-open-gl",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
pkg-config = "0.3"

[target.'cfg(not(target_os = "linux"))'.build-dependencies]
napi-build = "2"
