name: ConduitMobileSpike
options:
  bundleIdPrefix: media.conduit
packages:
  MPVKit:
    url: https://github.com/NuvioMedia/MPVKit.git
    revision: d5cf091c80368bbbc1bbf2d195fbc55d926df888
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.10"
targets:
  ConduitMobileSpike:
    type: application
    platform: iOS
    sources: [ConduitMobileSpike]
    dependencies:
      - package: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.conduit.mobile.spike
        INFOPLIST_FILE: ConduitMobileSpike/Info.plist
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "-framework ComposeApp"
    preBuildScripts:
      - name: Build Compose framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
