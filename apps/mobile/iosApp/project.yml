name: ConduitMobileSpike
options:
  bundleIdPrefix: media.conduit
packages:
  KSPlayer:
    # Fork carrying two fixes on top of kingslay/KSPlayer 25c923b:
    # - iOS 26 tinny audio: bypass AVAudioUnitTimePitch at rate 1x (d7d1521)
    # - PiP speaker crackle: stereo downmix on built-in-speaker routes (aadf037)
    # Revisit upstream before bumping.
    url: https://github.com/davidvanderklay/KSPlayer.git
    revision: aadf0374700fec095c46df3647010318f0c79927
  MPVKit:
    path: MPVKitCompat
schemes:
  ConduitMobileSpike:
    build:
      targets:
        ConduitMobileSpike: all
    test:
      targets:
        - ConduitMobileSpikeTests
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
targets:
  ConduitMobileSpike:
    type: application
    platform: iOS
    sources: [ConduitMobileSpike]
    dependencies:
      - package: KSPlayer
      - package: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.conduit.mobile
        PRODUCT_NAME: conduit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: ConduitMobileSpike/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: ConduitMobileSpike/ConduitMobileSpike-Bridging-Header.h
        # Xcode-beta does not add the device slices of FFmpegKit's static
        # frameworks to its normal product search path.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME) $(BUILD_DIR)/../../SourcePackages/checkouts/FFmpegKit/Sources"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        "OTHER_LDFLAGS[sdk=iphoneos*]": "-framework ComposeApp $(SRCROOT)/../native/ios/iosArm64/libconduit_mobile.a"
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": "-framework ComposeApp $(SRCROOT)/../native/ios/iosSimulatorArm64/libconduit_mobile.a"
    preBuildScripts:
      - name: Build Compose framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
  ConduitMobileSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ConduitMobileSpikeTests]
    dependencies:
      - target: ConduitMobileSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.conduit.mobile.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/conduit.app/conduit"
        BUNDLE_LOADER: "$(TEST_HOST)"
