name: ConduitMobileSpike
options:
  bundleIdPrefix: media.conduit
packages:
  MPVKit:
    url: https://github.com/NuvioMedia/MPVKit.git
    revision: d5cf091c80368bbbc1bbf2d195fbc55d926df888
schemes:
  ConduitMobileSpike:
    build:
      targets:
        ConduitMobileSpike: all
    test:
      targets:
        - ConduitMobileSpikeTests
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    # The Compose/MPVKit simulator artifacts are arm64-only; every target
    # that links or imports them must skip the x86_64 simulator slice.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  ConduitMobileSpike:
    type: application
    platform: iOS
    sources: [ConduitMobileSpike]
    dependencies:
      - package: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.conduit.mobile
        PRODUCT_NAME: conduit
        DEVELOPMENT_TEAM: PYG6R5S4Q7
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: ConduitMobileSpike/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: ConduitMobileSpike/ConduitMobileSpike-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "-framework ComposeApp -lsqlite3 $(SRCROOT)/../native/ios/iosArm64/libconduit_mobile.a"
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": "-framework ComposeApp -lsqlite3 $(SRCROOT)/../native/ios/iosSimulatorArm64/libconduit_mobile.a"
    preBuildScripts:
      - name: Build Compose framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
  ConduitMobileSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ConduitMobileSpikeTests]
    dependencies:
      - target: ConduitMobileSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.conduit.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/conduit.app/conduit"
        BUNDLE_LOADER: "$(TEST_HOST)"
