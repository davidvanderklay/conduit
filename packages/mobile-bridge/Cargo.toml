[package]
name = "conduit-mobile"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stable mobile FFI boundary for the Conduit media engine"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
p2p = ["dep:conduit-p2p", "dep:rustls-platform-verifier"]
host-jni = ["dep:jni"]

[dependencies]
conduit-p2p = { path = "../p2p", optional = true }
conduit-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = { version = "0.22", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[target.'cfg(target_os = "android")'.dependencies.rustls-platform-verifier]
version = "0.7.1"
optional = true
