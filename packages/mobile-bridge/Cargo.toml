[package]
name = "conduit-mobile"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stable mobile FFI boundary for the Conduit media engine"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
host-jni = ["dep:jni"]

[dependencies]
conduit-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = { version = "0.22", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
