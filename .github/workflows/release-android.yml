name: Android release

on:
  push:
    tags: ["android/v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing android/vVERSION tag to build; manual runs never publish
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  prepare:
    uses: ./.github/workflows/release-context.yml
    with:
      component: android
      release_tag: ${{ inputs.release_tag || '' }}

  android:
    needs: prepare
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: apps/mobile/**/*.gradle*
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;28.2.13676358"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
      - name: Install pinned Rust Android packager
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-ndk@3.5.4
      - name: Build Rust JNI libraries
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" apps/mobile/scripts/build-rust-android.sh
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/conduit-release.jks"
      - name: Build signed release APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/conduit-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CONDUIT_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          CONDUIT_VERSION_CODE: ${{ needs.prepare.outputs.build_number }}
        run: |
          version="$CONDUIT_VERSION_NAME"
          CONDUIT_VERSION_NAME="$version" ./gradlew --no-daemon :composeApp:testDebugUnitTest :composeApp:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            composeApp/build/outputs/apk/release/composeApp-release.apk
          node ../../scripts/verify-android-release.mjs \
            composeApp/build/outputs/apk/release/composeApp-release.apk
          mkdir -p ../../target/release/bundle/android
          cp composeApp/build/outputs/apk/release/composeApp-release.apk \
            "../../target/release/bundle/android/conduit-${version}-android-universal.apk"
          cd ../../target/release/bundle/android
          sha256sum "conduit-${version}-android-universal.apk" \
            > "conduit-${version}-android-universal.apk.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduit-android
          path: target/release/bundle/android/*
          if-no-files-found: error

  publish:
    name: Publish Android release
    if: github.event_name == 'push'
    needs: [prepare, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conduit-android
          path: artifacts
      - name: Publish component notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: android
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/publish-component-release.mjs
          bash scripts/upload-release-assets.sh "$RELEASE_TAG" artifacts/*
