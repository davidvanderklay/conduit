name: Publish component update feed
on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      release_tag:
        type: string
        required: true
      revision:
        type: string
        required: true
permissions:
  contents: write
# Component workflows serialize their own releases. Feed pushes use bounded
# optimistic retries so another component cannot overwrite the shared branch.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Download desktop updater metadata
        if: inputs.component == 'desktop'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --pattern '*.yml' --dir artifacts
      - name: Advance component feeds
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: node scripts/publish-update-feed.mjs
