name: iOS release

on:
  push:
    tags: ["ios/v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing ios/vVERSION tag to build; manual runs never publish
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  prepare:
    uses: ./.github/workflows/release-context.yml
    with:
      component: ios
      release_tag: ${{ inputs.release_tag || '' }}

  ios:
    needs: prepare
    name: iOS unsigned IPA
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CONDUIT_P2P: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Verify iOS 26 SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "$sdk_version" == 26.* ]] || {
            echo "Expected an iOS 26 SDK, found $sdk_version" >&2
            exit 1
          }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: apps/mobile/**/*.gradle*
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .
      - name: Build iOS Rust libraries
        run: apps/mobile/scripts/build-rust-ios.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned iOS IPA
        env:
          CONDUIT_VERSION: ${{ needs.prepare.outputs.version }}
          CONDUIT_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: apps/mobile/scripts/package-ios-ipa.sh "$CONDUIT_VERSION" "$CONDUIT_BUILD_NUMBER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conduit-ios
          path: target/release/bundle/ios/*
          if-no-files-found: error

  publish:
    name: Publish iOS release
    if: github.event_name == 'push'
    needs: [prepare, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conduit-ios
          path: artifacts
      - name: Publish component notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ios
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/publish-component-release.mjs
          bash scripts/upload-release-assets.sh "$RELEASE_TAG" artifacts/*

  update-feed:
    if: github.event_name == 'push'
    needs: [prepare, publish]
    uses: ./.github/workflows/publish-update-feed.yml
    with:
      component: ios
      release_tag: ${{ needs.prepare.outputs.tag }}
      revision: ${{ needs.prepare.outputs.revision }}
