name: Android CI

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/desktop/icon.svg"
      - "packages/mobile-bridge/**"
      - "packages/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile-android.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/desktop/icon.svg"
      - "packages/mobile-bridge/**"
      - "packages/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: apps/mobile/**/*.gradle*
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK components
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;28.2.13676358"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install pinned Rust Android packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@3.5.4
      - name: Build Rust JNI libraries
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" apps/mobile/scripts/build-rust-android.sh
      - name: Run unit tests and build debug APK
        working-directory: apps/mobile
        run: ./gradlew --no-daemon :composeApp:testDebugUnitTest :composeApp:assembleDebug
