name: Desktop release

env:
  VITE_API_URL: ${{ vars.PRODUCTION_API_URL }}

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      target:
        description: Release artifact to build
        type: choice
        options:
          - all
          - flatpak
        default: all

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  production-config:
    name: Validate production server
    runs-on: ubuntu-22.04
    steps:
      - name: Require an HTTPS production API
        run: |
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "Set the PRODUCTION_API_URL repository variable to the public HTTPS API." >&2; exit 1 ;;
          esac

  windows:
    needs: production-config
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}"
      - run: pnpm --filter @conduit/desktop setup:windows
      - name: Build NSIS installer
        run: pnpm --filter @conduit/desktop exec tauri build --config src-tauri/tauri.windows.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux-appimage:
    needs: production-config
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libmpv-dev \
            libegl1-mesa-dev
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        if: github.ref_type == 'tag'
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Build AppImage
        run: pnpm --filter @conduit/desktop exec tauri build --config src-tauri/tauri.linux.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  linux-flatpak:
    needs: production-config
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'flatpak'
    name: Linux Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            flatpak \
            flatpak-builder \
            ostree
      - name: Set version from tag
        if: github.ref_type == 'tag'
        run: |
          RELEASE_DATE="$(git show -s --format=%cs "$GITHUB_SHA")" \
            node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Configure production server
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "flatpak/media.conduit.desktop.yml";
            const source = fs.readFileSync(path, "utf8");
            const marker = "        CARGO_HOME: /run/build/conduit/cargo";
            if (!source.includes(marker)) throw new Error("Flatpak environment marker not found");
            fs.writeFileSync(
              path,
              source.replace(marker, `${marker}\n        VITE_API_URL: ${JSON.stringify(process.env.VITE_API_URL)}`),
            );
          '
      - name: Import repository signing key
        if: github.ref_type == 'tag'
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
      - name: Restore published repository
        if: github.ref_type == 'tag'
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/flatpak-repo; then
            git worktree add -B flatpak-repo flatpak-site origin/flatpak-repo
            test -f flatpak-site/repo/config
            mkdir -p flatpak-site/repo/refs/remotes
            ostree fsck --repo=flatpak-site/repo
          else
            git worktree add --detach flatpak-site
            git -C flatpak-site switch --orphan flatpak-repo
            mkdir -p flatpak-site/repo
          fi
      - name: Build Flatpak repository and bundle
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          repository=flatpak-repo
          signing_options=()
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            repository=flatpak-site/repo
            signing_options=(
              "--gpg-sign=${GPG_KEY_ID}"
              "--gpg-homedir=${HOME}/.gnupg"
              "--collection-id=media.conduit.desktop"
            )
          fi

          appstreamcli validate --no-net flatpak/media.conduit.desktop.metainfo.xml
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder \
            --force-clean \
            --user \
            --jobs=2 \
            --install-deps-from=flathub \
            --repo="$repository" \
            "${signing_options[@]}" \
            flatpak-build \
            flatpak/media.conduit.desktop.yml
          mkdir -p target/release/bundle
          flatpak build-bundle \
            "$repository" \
            target/release/bundle/conduit.flatpak \
            media.conduit.desktop \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Finalize and verify signed repository
        if: github.ref_type == 'tag'
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          public_key="$(mktemp)"
          gpg --batch --export "$GPG_KEY_ID" > "$public_key"
          gpg --batch --armor --export "$GPG_KEY_ID" \
            > flatpak-site/conduit-flatpak-signing-key.asc
          printf '%s\n' "$GPG_KEY_ID" \
            > flatpak-site/conduit-flatpak-signing-key.txt

          flatpak build-update-repo \
            --gpg-sign="$GPG_KEY_ID" \
            --gpg-homedir="${HOME}/.gnupg" \
            --generate-static-deltas \
            --title="Conduit" \
            --comment="Self-hosted film and television client" \
            --description="Signed releases of the Conduit desktop application" \
            --homepage="https://github.com/davidvanderklay/conduit" \
            --default-branch=master \
            --collection-id=media.conduit.desktop \
            flatpak-site/repo

          gpg_key="$(base64 --wrap=0 < "$public_key")"
          sed \
            -e "s|@GPG_KEY@|${gpg_key}|" \
            flatpak/conduit.flatpakrepo.in \
            > flatpak-site/conduit.flatpakrepo
          touch flatpak-site/.nojekyll

          ostree fsck --repo=flatpak-site/repo
          test -s flatpak-site/repo/summary
          test -s flatpak-site/repo/summary.sig
          flatpak remote-add \
            --user \
            --if-not-exists \
            --gpg-import="$public_key" \
            conduit-ci \
            "file://${PWD}/flatpak-site/repo"
          flatpak remote-ls --user conduit-ci \
            | grep -F "media.conduit.desktop"
          flatpak install \
            --user \
            --noninteractive \
            --no-deps \
            conduit-ci \
            media.conduit.desktop
          linkage="$(
            flatpak run --command=sh media.conduit.desktop \
              -c 'ldd /app/bin/conduit'
          )"
          if grep -F 'not found' <<< "$linkage"; then
            echo "Flatpak executable has unresolved shared libraries" >&2
            exit 1
          fi
          flatpak info --user media.conduit.desktop \
            | grep -F "Version: ${GITHUB_REF_NAME#v}"
      - name: Preserve repository history
        if: github.ref_type == 'tag'
        run: |
          git -C flatpak-site config user.name github-actions
          git -C flatpak-site config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git -C flatpak-site add --all
          if ! git -C flatpak-site diff --cached --quiet; then
            git -C flatpak-site commit \
              -m "Publish Flatpak ${GITHUB_REF_NAME}"
          fi
          git -C flatpak-site push origin HEAD:flatpak-repo
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-linux-flatpak
          path: target/release/bundle/conduit.flatpak
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@v3
        with:
          path: flatpak-site

  macos:
    needs: production-config
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install macOS packaging dependencies
        run: brew install dylibbundler mpv pkg-config
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        if: github.ref_type == 'tag'
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Build macOS application
        run: |
          pnpm --filter @conduit/desktop exec tauri build \
            --target "${{ matrix.target }}" \
            --config src-tauri/tauri.macos.conf.json
      - name: Bundle libmpv and create DMG
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          app="target/${RUST_TARGET}/release/bundle/macos/conduit.app"
          executable_name="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "${app}/Contents/Info.plist"
          )"
          executable="${app}/Contents/MacOS/${executable_name}"
          frameworks="${app}/Contents/Frameworks"
          output_dir="target/release/bundle/macos"
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"

          mkdir -p "$frameworks" "$output_dir"
          dylibbundler \
            -od \
            -b \
            -x "$executable" \
            -d "$frameworks" \
            -p @executable_path/../Frameworks

          if otool -L "$executable" "$frameworks"/*.dylib | grep -E '/(opt/homebrew|usr/local)/'; then
            echo "Homebrew library reference remains in the application bundle" >&2
            exit 1
          fi

          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          staging="$(mktemp -d)"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "Conduit" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            "${output_dir}/conduit_${version}_${MACOS_ARCH}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-macos-${{ matrix.arch }}
          path: target/release/bundle/macos/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [windows, linux-appimage, linux-flatpak, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: conduit-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*

  publish-flatpak-repository:
    name: Publish Flatpak repository
    if: github.ref_type == 'tag'
    needs: [linux-flatpak]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy repository atomically
        id: deployment
        uses: actions/deploy-pages@v4
