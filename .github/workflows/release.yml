name: Release

env:
  VITE_API_URL: ${{ vars.PRODUCTION_API_URL }}

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      target:
        description: Release artifact to build
        type: choice
        options:
          - all
          - android
          - flatpak
          - ios
          - macos
        default: all
      release_tag:
        description: Existing release version to rebuild
        type: string
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  production-config:
    name: Validate production server
    runs-on: ubuntu-22.04
    steps:
      - name: Require an HTTPS production API
        run: |
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "Set the PRODUCTION_API_URL repository variable to the public HTTPS API." >&2; exit 1 ;;
          esac

  windows:
    needs: production-config
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: wasm-pack
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}"
      - run: pnpm --filter @conduit/desktop setup:windows
      - name: Build Electron NSIS installer
        run: pnpm --filter @conduit/desktop dist:win
      - name: Verify installer
        shell: bash
        run: ls -lh apps/desktop/dist/*.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduit-windows
          path: apps/desktop/dist/*.exe
          if-no-files-found: error

  linux-appimage:
    needs: production-config
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: wasm-pack
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libmpv-dev \
            libegl1-mesa-dev \
            libx11-dev \
            xvfb
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        if: github.ref_type == 'tag'
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Build Electron AppImage
        run: xvfb-run --auto-servernum pnpm --filter @conduit/desktop dist:linux
      - name: Verify AppImage
        run: |
          test -x apps/desktop/dist/linux-unpacked/resources/native/conduit-electron-native
          ls -lh apps/desktop/dist/*.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduit-linux-appimage
          path: apps/desktop/dist/*.AppImage
          if-no-files-found: error

  linux-flatpak:
    needs: production-config
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'flatpak'
    name: Linux Flatpak
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            flatpak \
            flatpak-builder \
            ostree
      - name: Set version from release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.target == 'flatpak' && inputs.release_tag != '')
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          RELEASE_DATE="$(git show -s --format=%cs "$GITHUB_SHA")" \
            node scripts/set-release-version.mjs "${RELEASE_VERSION#v}"
      - name: Configure production server
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const path = "flatpak/media.conduit.desktop.yml";
            const source = fs.readFileSync(path, "utf8");
            const marker = "        CARGO_HOME: /run/build/conduit/cargo";
            if (!source.includes(marker)) throw new Error("Flatpak environment marker not found");
            fs.writeFileSync(
              path,
              source.replace(marker, `${marker}\n        VITE_API_URL: ${JSON.stringify(process.env.VITE_API_URL)}`),
            );
          '
      - name: Import repository signing key
        if: github.ref_type == 'tag'
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
      - name: Restore published repository
        if: github.ref_type == 'tag'
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/flatpak-repo; then
            git worktree add -B flatpak-repo flatpak-site origin/flatpak-repo
            test -f flatpak-site/repo/config
            mkdir -p flatpak-site/repo/refs/remotes
            ostree fsck --repo=flatpak-site/repo
          else
            git worktree add --detach flatpak-site
            git -C flatpak-site switch --orphan flatpak-repo
            mkdir -p flatpak-site/repo
          fi
      - name: Build Flatpak repository and bundle
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          repository=flatpak-repo
          signing_options=()
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            repository=flatpak-site/repo
            signing_options=(
              "--gpg-sign=${GPG_KEY_ID}"
              "--gpg-homedir=${HOME}/.gnupg"
              "--collection-id=media.conduit.desktop"
            )
          fi

          appstreamcli validate --no-net flatpak/media.conduit.desktop.metainfo.xml
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install \
            --user \
            --noninteractive \
            --no-static-deltas \
            flathub \
            org.freedesktop.Sdk.Extension.node24/x86_64/25.08
          flatpak-builder \
            --force-clean \
            --user \
            --jobs=2 \
            --install-deps-from=flathub \
            --repo="$repository" \
            "${signing_options[@]}" \
            flatpak-build \
            flatpak/media.conduit.desktop.yml
          mkdir -p target/release/bundle
          flatpak build-bundle \
            "$repository" \
            target/release/bundle/conduit.flatpak \
            media.conduit.desktop \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Finalize and verify signed repository
        if: github.ref_type == 'tag'
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          public_key="$(mktemp)"
          gpg --batch --export "$GPG_KEY_ID" > "$public_key"
          gpg --batch --armor --export "$GPG_KEY_ID" \
            > flatpak-site/conduit-flatpak-signing-key.asc
          printf '%s\n' "$GPG_KEY_ID" \
            > flatpak-site/conduit-flatpak-signing-key.txt

          flatpak build-update-repo \
            --gpg-sign="$GPG_KEY_ID" \
            --gpg-homedir="${HOME}/.gnupg" \
            --generate-static-deltas \
            --title="Conduit" \
            --comment="Self-hosted film and television client" \
            --description="Signed releases of the Conduit desktop application" \
            --homepage="https://github.com/davidvanderklay/conduit" \
            --default-branch=master \
            --collection-id=media.conduit.desktop \
            flatpak-site/repo

          gpg_key="$(base64 --wrap=0 < "$public_key")"
          sed \
            -e "s|@GPG_KEY@|${gpg_key}|" \
            flatpak/conduit.flatpakrepo.in \
            > flatpak-site/conduit.flatpakrepo
          touch flatpak-site/.nojekyll

          ostree fsck --repo=flatpak-site/repo
          test -s flatpak-site/repo/summary
          test -s flatpak-site/repo/summary.sig
          flatpak remote-add \
            --user \
            --if-not-exists \
            --gpg-import="$public_key" \
            conduit-ci \
            "file://${PWD}/flatpak-site/repo"
          flatpak remote-ls --user conduit-ci \
            | grep -F "media.conduit.desktop"
          test -x flatpak-build/files/bin/conduit-electron-native
          test -f flatpak-build/files/lib/conduit/resources/app/electron/dist/main.js
          test -f flatpak-build/files/lib/conduit/resources/web/index.html
          test -s target/release/bundle/conduit.flatpak
      - name: Preserve repository history
        if: github.ref_type == 'tag'
        run: |
          git -C flatpak-site config user.name github-actions
          git -C flatpak-site config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git -C flatpak-site add --all
          if ! git -C flatpak-site diff --cached --quiet; then
            git -C flatpak-site commit \
              -m "Publish Flatpak ${GITHUB_REF_NAME}"
          fi
          git -C flatpak-site push origin HEAD:flatpak-repo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduit-linux-flatpak
          path: target/release/bundle/conduit.flatpak
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: flatpak-site

  macos:
    needs: production-config
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos'
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target == 'macos' && inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: wasm-pack
      - name: Install macOS packaging dependencies
        run: brew install mpv pkg-config
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.target == 'macos' && inputs.release_tag != '')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/set-release-version.mjs "${RELEASE_TAG#v}"
      - name: Build Electron DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            pnpm --filter @conduit/desktop dist:mac:arm64
          else
            pnpm --filter @conduit/desktop dist:mac:x64
          fi
      - name: Verify DMG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/dist/*-macos-${{ matrix.arch }}.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="${dmgs[0]}"
          hdiutil imageinfo "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" | awk '{print $1}' > "$dmg.sha256"
          cat "$dmg.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduit-macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*-macos-${{ matrix.arch }}.dmg
            apps/desktop/dist/*-macos-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error

  ios:
    needs: production-config
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ios'
    name: iOS unsigned IPA
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify iOS 26 SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "$sdk_version" == 26.* ]] || {
            echo "Expected an iOS 26 SDK, found $sdk_version" >&2
            exit 1
          }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: apps/mobile/**/*.gradle*
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
      - name: Build iOS Rust libraries
        run: apps/mobile/scripts/build-rust-ios.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned iOS IPA
        env:
          CONDUIT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || format('0.0.0-ci.{0}', github.run_number) }}
        run: |
          version="${CONDUIT_VERSION#v}"
          apps/mobile/scripts/package-ios-ipa.sh "$version" "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduit-ios
          path: target/release/bundle/ios/*
          if-no-files-found: error

  android:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android'
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: apps/mobile/**/*.gradle*
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install pinned Android SDK components
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;28.2.13676358"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
      - name: Install pinned Rust Android packager
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-ndk@3.5.4
      - name: Build Rust JNI libraries
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" apps/mobile/scripts/build-rust-android.sh
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/conduit-release.jks"
      - name: Build signed release APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/conduit-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CONDUIT_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-ci.{0}', github.run_number) }}
          CONDUIT_VERSION_CODE: ${{ github.run_number }}
        run: |
          version="${CONDUIT_VERSION_NAME#v}"
          CONDUIT_VERSION_NAME="$version" ./gradlew --no-daemon :composeApp:testDebugUnitTest :composeApp:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            composeApp/build/outputs/apk/release/composeApp-release.apk
          mkdir -p ../../target/release/bundle/android
          cp composeApp/build/outputs/apk/release/composeApp-release.apk \
            "../../target/release/bundle/android/conduit-${version}-android-universal.apk"
          cd ../../target/release/bundle/android
          sha256sum "conduit-${version}-android-universal.apk" \
            > "conduit-${version}-android-universal.apk.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduit-android
          path: target/release/bundle/android/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all')
    needs: [windows, linux-appimage, linux-flatpak, macos, ios, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conduit-*
          path: artifacts
          merge-multiple: true
      - name: Verify downloaded macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(artifacts/*.dmg)
          test "${#dmgs[@]}" -eq 2
          for dmg in "${dmgs[@]}"; do
            manifest="$dmg.sha256"
            test -f "$manifest"
            expected="$(<"$manifest")"
            actual="$(sha256sum "$dmg" | awk '{print $1}')"
            test "$expected" = "$actual"
          done
      - name: Stage non-DMG release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -maxdepth 1 -type f \
            ! -name '*.dmg' \
            ! -name '*.dmg.sha256' \
            -exec cp {} release-files/ \;
          cp compose.yaml .env.docker.example release-files/
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
          files: release-files/*
      - name: Upload DMGs with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/upload-release-assets.sh "$RELEASE_TAG" artifacts/*.dmg

  replace-macos-assets:
    name: Replace macOS release assets
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'macos' && inputs.release_tag != ''
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conduit-macos-*
          path: artifacts
          merge-multiple: true
      - name: Verify replacement DMGs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(artifacts/*.dmg)
          test "${#dmgs[@]}" -eq 2
          for dmg in "${dmgs[@]}"; do
            manifest="$dmg.sha256"
            test -f "$manifest"
            expected="$(<"$manifest")"
            actual="$(sha256sum "$dmg" | awk '{print $1}')"
            test "$expected" = "$actual"
          done
      - name: Replace DMGs on the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/upload-release-assets.sh "$RELEASE_TAG" artifacts/*.dmg

  replace-flatpak-asset:
    name: Replace Flatpak release asset
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'flatpak' && inputs.release_tag != ''
    needs: linux-flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conduit-linux-flatpak
          path: artifacts
      - name: Verify Flatpak bundle
        run: test -s artifacts/conduit.flatpak
      - name: Replace Flatpak on the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/upload-release-assets.sh "$RELEASE_TAG" artifacts/conduit.flatpak

  verify-macos-release:
    name: Verify public macOS DMGs
    if: always() && (needs.publish.result == 'success' || needs.replace-macos-assets.result == 'success')
    needs: [publish, replace-macos-assets]
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conduit-macos-*
          path: expected
          merge-multiple: true
      - name: Download and verify public DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -n 1)"
          test -n "$release_id"
          mkdir -p downloaded
          shopt -s nullglob
          dmgs=(expected/*.dmg)
          test "${#dmgs[@]}" -eq 2
          for expected_dmg in "${dmgs[@]}"; do
            name="$(basename "$expected_dmg")"
            asset_url="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq ".[] | select(.name == \"$name\") | .browser_download_url" | head -n 1)"
            test -n "$asset_url"
            downloaded_dmg="downloaded/$name"
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/octet-stream' \
              "$asset_url" --output "$downloaded_dmg"
            expected="$(<"$expected_dmg.sha256")"
            actual="$(shasum -a 256 "$downloaded_dmg" | awk '{print $1}')"
            test "$expected" = "$actual"
            hdiutil imageinfo "$downloaded_dmg"
            hdiutil verify "$downloaded_dmg"
          done

  publish-flatpak-repository:
    name: Publish Flatpak repository
    if: github.ref_type == 'tag'
    needs: [linux-flatpak]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy repository atomically
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
