name: Desktop release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}"
      - run: pnpm --filter @conduit/desktop setup:windows
      - name: Build NSIS installer
        run: pnpm --filter @conduit/desktop exec tauri build --config src-tauri/tauri.windows.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage and Flatpak
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libmpv-dev \
            libegl1-mesa-dev
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        if: github.ref_type == 'tag'
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Build AppImage
        run: pnpm --filter @conduit/desktop exec tauri build --config src-tauri/tauri.linux.conf.json
      - name: Stage AppImage contents for Flatpak
        run: |
          appimage="$(find target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          chmod +x "$appimage"
          cd flatpak
          ../"$appimage" --appimage-extract
          mv squashfs-root appdir
      - name: Build Flatpak bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder \
            --force-clean \
            --user \
            --install-deps-from=flathub \
            --repo=flatpak-repo \
            flatpak-build \
            flatpak/media.conduit.desktop.yml
          flatpak build-bundle \
            flatpak-repo \
            target/release/bundle/conduit.flatpak \
            media.conduit.desktop \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/conduit.flatpak
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: conduit-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
