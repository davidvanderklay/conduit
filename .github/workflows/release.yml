name: Desktop release

env:
  VITE_API_URL: ${{ vars.PRODUCTION_API_URL }}

on:
  push:
    tags: ["desktop/v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Desktop artifact to build
        type: choice
        options: [all, flatpak, macos]
        default: all
      release_tag:
        description: Existing desktop/vVERSION tag to rebuild; empty builds the selected ref without publishing
        type: string
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

# All desktop tags share the signed Flatpak repository history.
concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  prepare:
    uses: ./.github/workflows/release-context.yml
    with:
      component: desktop
      release_tag: ${{ inputs.release_tag || '' }}

  production-config:
    needs: prepare
    name: Validate production server
    runs-on: ubuntu-22.04
    steps:
      - name: Require an HTTPS production API
        run: |
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "Set the PRODUCTION_API_URL repository variable to the public HTTPS API." >&2; exit 1 ;;
          esac

  windows:
    needs: [prepare, production-config]
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: wasm-pack
      - run: pnpm install --frozen-lockfile
      - name: Set desktop version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          RELEASE_DATE="$(git show -s --format=%cs HEAD)" \
            node scripts/set-release-version.mjs "$RELEASE_VERSION"
      - run: pnpm --filter @conduit/desktop setup:windows
      - name: Require Windows signing for releases
        if: github.event_name == 'push'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: test -n "$CSC_LINK"
      - name: Build Electron NSIS installer
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm --filter @conduit/desktop dist:win --config.forceCodeSigning=${{ github.event_name == 'push' }}
      - name: Verify Windows release signature
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/dist/*.exe | ForEach-Object {
            if ((Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid') {
              throw 'Windows installer signature is invalid'
            }
          }
      - name: Verify installer
        shell: bash
        run: ls -lh apps/desktop/dist/*.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduit-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.yml
          if-no-files-found: error

  linux-appimage:
    needs: [prepare, production-config]
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: wasm-pack
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libmpv-dev \
            libegl1-mesa-dev \
            libx11-dev \
            xvfb
      - run: pnpm install --frozen-lockfile
      - name: Set desktop version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          RELEASE_DATE="$(git show -s --format=%cs HEAD)" \
            node scripts/set-release-version.mjs "$RELEASE_VERSION"
      - name: Build Electron AppImage
        run: xvfb-run --auto-servernum pnpm --filter @conduit/desktop dist:linux
      - name: Verify AppImage
        run: |
          test -x apps/desktop/dist/linux-unpacked/resources/native/conduit-electron-native
          ls -lh apps/desktop/dist/*.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduit-linux-appimage
          path: apps/desktop/dist/*.AppImage
          if-no-files-found: error

  linux-flatpak:
    env:
      FLATPAK_BRANCH: ${{ contains(github.ref_name, '-nightly.') && 'nightly' || 'master' }}
    needs: [prepare, production-config]
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'flatpak'
    name: Linux Flatpak
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            flatpak \
            flatpak-builder \
            ostree
      - name: Set desktop version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          RELEASE_DATE="$(git show -s --format=%cs HEAD)" \
            node scripts/set-release-version.mjs "$RELEASE_VERSION"
      - name: Configure production server
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const path = "flatpak/media.conduit.desktop.yml";
            const source = fs.readFileSync(path, "utf8");
            const marker = "        CARGO_HOME: /run/build/conduit/cargo";
            if (!source.includes(marker)) throw new Error("Flatpak environment marker not found");
            fs.writeFileSync(
              path,
              source.replace(marker, `${marker}\n        VITE_API_URL: ${JSON.stringify(process.env.VITE_API_URL)}`)
                .replace("CONDUIT_FLATPAK_TRACK=stable", `CONDUIT_FLATPAK_TRACK=${process.env.FLATPAK_BRANCH === "nightly" ? "nightly" : "stable"}`),
            );
          '
      - name: Import repository signing key
        if: github.event_name == 'push'
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
      - name: Restore published repository
        if: github.event_name == 'push'
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/flatpak-repo; then
            git worktree add -B flatpak-repo flatpak-site origin/flatpak-repo
            test -f flatpak-site/repo/config
            mkdir -p flatpak-site/repo/refs/remotes
            ostree fsck --repo=flatpak-site/repo
          else
            git worktree add --detach flatpak-site
            git -C flatpak-site switch --orphan flatpak-repo
            mkdir -p flatpak-site/repo
          fi
      - name: Build Flatpak repository and bundle
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          repository=flatpak-repo
          signing_options=()
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            repository=flatpak-site/repo
            signing_options=(
              "--gpg-sign=${GPG_KEY_ID}"
              "--gpg-homedir=${HOME}/.gnupg"
              "--collection-id=media.conduit.desktop"
            )
          fi

          appstreamcli validate --no-net flatpak/media.conduit.desktop.metainfo.xml
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install \
            --user \
            --noninteractive \
            --no-static-deltas \
            flathub \
            org.freedesktop.Sdk.Extension.node24/x86_64/25.08
          flatpak-builder \
            --force-clean \
            --default-branch="$FLATPAK_BRANCH" \
            --user \
            --jobs=2 \
            --install-deps-from=flathub \
            --repo="$repository" \
            "${signing_options[@]}" \
            flatpak-build \
            flatpak/media.conduit.desktop.yml
          mkdir -p target/release/bundle
          flatpak build-bundle \
            "$repository" \
            target/release/bundle/conduit.flatpak \
            media.conduit.desktop "$FLATPAK_BRANCH" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Finalize and verify signed repository
        if: github.event_name == 'push'
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          public_key="$(mktemp)"
          gpg --batch --export "$GPG_KEY_ID" > "$public_key"
          gpg --batch --armor --export "$GPG_KEY_ID" \
            > flatpak-site/conduit-flatpak-signing-key.asc
          printf '%s\n' "$GPG_KEY_ID" \
            > flatpak-site/conduit-flatpak-signing-key.txt

          flatpak build-update-repo \
            --gpg-sign="$GPG_KEY_ID" \
            --gpg-homedir="${HOME}/.gnupg" \
            --generate-static-deltas \
            --title="Conduit" \
            --comment="Self-hosted film and television client" \
            --description="Signed releases of the Conduit desktop application" \
            --homepage="https://github.com/davidvanderklay/conduit" \
            --default-branch=master \
            --collection-id=media.conduit.desktop \
            flatpak-site/repo

          gpg_key="$(base64 --wrap=0 < "$public_key")"
          sed \
            -e "s|@GPG_KEY@|${gpg_key}|" \
            flatpak/conduit.flatpakrepo.in \
            > flatpak-site/conduit.flatpakrepo
          touch flatpak-site/.nojekyll

          ostree fsck --repo=flatpak-site/repo
          test -s flatpak-site/repo/summary
          test -s flatpak-site/repo/summary.sig
          flatpak remote-add \
            --user \
            --if-not-exists \
            --gpg-import="$public_key" \
            conduit-ci \
            "file://${PWD}/flatpak-site/repo"
          flatpak remote-ls --user conduit-ci \
            | grep -F "media.conduit.desktop"
          test -x flatpak-build/files/bin/conduit-electron-native
          test -f flatpak-build/files/lib/conduit/resources/app/electron/dist/main.js
          test -f flatpak-build/files/lib/conduit/resources/web/index.html
          test -s target/release/bundle/conduit.flatpak
      - name: Preserve repository history
        if: github.event_name == 'push'
        run: |
          git -C flatpak-site config user.name github-actions
          git -C flatpak-site config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git -C flatpak-site add --all
          if ! git -C flatpak-site diff --cached --quiet; then
            git -C flatpak-site commit \
              -m "Publish Flatpak ${GITHUB_REF_NAME}"
          fi
          git -C flatpak-site push origin HEAD:flatpak-repo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduit-linux-flatpak
          path: target/release/bundle/conduit.flatpak
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: flatpak-site

  macos:
    needs: [prepare, production-config]
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos'
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: wasm-pack
      - name: Install macOS packaging dependencies
        run: brew install mpv pkg-config
      - run: pnpm install --frozen-lockfile
      - name: Set desktop version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          RELEASE_DATE="$(git show -s --format=%cs HEAD)" \
            node scripts/set-release-version.mjs "$RELEASE_VERSION"
      - name: Require Mac signing and notarization for releases
        if: github.event_name == 'push'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: test -n "$CSC_LINK" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
      - name: Build Electron DMG and update ZIP
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            pnpm --filter @conduit/desktop dist:mac:arm64 --config.forceCodeSigning=${{ github.event_name == 'push' }}
          else
            pnpm --filter @conduit/desktop dist:mac:x64 --config.forceCodeSigning=${{ github.event_name == 'push' }}
          fi
      - name: Verify signed and notarized Mac application
        if: github.event_name == 'push'
        run: |
          application="$(find apps/desktop/dist -maxdepth 2 -type d -name 'conduit.app')"
          test -n "$application"
          codesign --verify --deep --strict "$application"
          xcrun stapler validate "$application"
      - name: Preserve architecture-specific updater metadata
        run: |
          for metadata in apps/desktop/dist/*-mac.yml; do
            mv "$metadata" "${metadata%.yml}-${{ matrix.arch }}.yml"
          done
      - name: Verify DMG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/dist/*-macos-${{ matrix.arch }}.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="${dmgs[0]}"
          hdiutil imageinfo "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" | awk '{print $1}' > "$dmg.sha256"
          cat "$dmg.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduit-macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*-macos-${{ matrix.arch }}.dmg
            apps/desktop/dist/*-macos-${{ matrix.arch }}.dmg.sha256
            apps/desktop/dist/*-macos-${{ matrix.arch }}.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*-mac-${{ matrix.arch }}.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [prepare, windows, linux-appimage, linux-flatpak, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conduit-*
          path: artifacts
          merge-multiple: true
      - name: Verify downloaded macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(artifacts/*.dmg)
          test "${#dmgs[@]}" -eq 2
          for dmg in "${dmgs[@]}"; do
            manifest="$dmg.sha256"
            test -f "$manifest"
            expected="$(<"$manifest")"
            actual="$(sha256sum "$dmg" | awk '{print $1}')"
            test "$expected" = "$actual"
          done
      - name: Create draft desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: desktop
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/publish-component-release.mjs --draft
      - name: Upload all desktop artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          bash scripts/upload-release-assets.sh "$RELEASE_TAG" artifacts/*
          gh release edit "$RELEASE_TAG" --draft=false

  verify-macos-release:
    name: Verify public macOS DMGs
    if: needs.publish.result == 'success'
    needs: [publish]
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conduit-macos-*
          path: expected
          merge-multiple: true
      - name: Download and verify public DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -n 1)"
          test -n "$release_id"
          mkdir -p downloaded
          shopt -s nullglob
          dmgs=(expected/*.dmg)
          test "${#dmgs[@]}" -eq 2
          for expected_dmg in "${dmgs[@]}"; do
            name="$(basename "$expected_dmg")"
            asset_url="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq ".[] | select(.name == \"$name\") | .browser_download_url" | head -n 1)"
            test -n "$asset_url"
            downloaded_dmg="downloaded/$name"
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/octet-stream' \
              "$asset_url" --output "$downloaded_dmg"
            expected="$(<"$expected_dmg.sha256")"
            actual="$(shasum -a 256 "$downloaded_dmg" | awk '{print $1}')"
            test "$expected" = "$actual"
            hdiutil imageinfo "$downloaded_dmg"
            hdiutil verify "$downloaded_dmg"
          done

  publish-flatpak-repository:
    name: Publish Flatpak repository
    if: github.event_name == 'push'
    needs: [linux-flatpak]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy repository atomically
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  update-feed:
    if: github.event_name == 'push'
    needs: [prepare, publish, verify-macos-release]
    uses: ./.github/workflows/publish-update-feed.yml
    with:
      component: desktop
      release_tag: ${{ needs.prepare.outputs.tag }}
      revision: ${{ needs.prepare.outputs.revision }}
