name: iOS CI

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/mobile-bridge/**"
      - "packages/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile-ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/mobile-bridge/**"
      - "packages/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile-ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: apps/mobile/**/*.gradle*
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
      - name: Build iOS Rust libraries
        run: apps/mobile/scripts/build-rust-ios.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run iOS unit tests
        working-directory: apps/mobile
        run: ./gradlew --no-daemon :composeApp:iosSimulatorArm64Test
      - name: Run iOS bridge policy tests
        working-directory: apps/mobile/iosApp
        run: |
          xcodegen generate
          xcodebuild test \
            -project ConduitMobileSpike.xcodeproj \
            -scheme ConduitMobileSpike \
            -destination 'platform=iOS Simulator,name=iPad (10th generation),OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
