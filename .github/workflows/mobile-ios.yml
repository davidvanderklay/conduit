name: iOS CI

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/mobile-bridge/**"
      - "packages/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile-ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/mobile-bridge/**"
      - "packages/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile-ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: apps/mobile/**/*.gradle*
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
      - name: Build iOS Rust libraries
        run: apps/mobile/scripts/build-rust-ios.sh
      - name: Run iOS unit tests
        working-directory: apps/mobile
        run: ./gradlew --no-daemon :composeApp:iosSimulatorArm64Test
