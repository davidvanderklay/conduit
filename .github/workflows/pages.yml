name: Publish documentation and Flatpak

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - scripts/pages_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Both docs pushes and desktop releases use this single publisher. Fetch the
# latest inputs only after acquiring the lock so queued runs cannot deploy stale
# docs or an older signed Flatpak snapshot.
concurrency:
  group: conduit-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish combined Pages site
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check out current signed Flatpak repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: flatpak-repo
          path: flatpak-site
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m mkdocs build --strict
      - name: Assemble site without changing Flatpak URLs
        run: python scripts/pages_site.py site/docs flatpak-site pages-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-site
      - name: Deploy combined site atomically
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
