services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - conduit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  conduit-postgres:
